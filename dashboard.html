<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리 반 대시보드</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffc7d6">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6ea; --card:#ffffff; --ink:#4a3b52; --muted:#9a8aa3; --line:#f1e6f3; --soft:#fbf6fd;
  --blue:#6c9cff; --blue-soft:#e3edff; --red:#ff6b8b; --red-soft:#ffe4ec;
  --green:#45c98a; --green-soft:#dcf7e9; --yellow:#ffb938; --yellow-soft:#fff3d6;
  --purple:#a68bff; --orange:#ff9a5a;
  --pink:#ffc7d6; --sky:#bfe0ff; --mint:#bdeedc; --lemon:#ffe9a3; --lav:#ddd2ff; --peach:#ffd6b8; --lime:#dbf2b5;
  --r:28px; --gap:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overflow:clip}
body{font-family:'Gowun Dodum','Noto Sans KR',system-ui,sans-serif;color:var(--ink);
  background-color:var(--bg);background-image:radial-gradient(#ffd9e3 2px,transparent 2.5px),radial-gradient(#d6e8ff 2px,transparent 2.5px);
  background-size:44px 44px;background-position:0 0,22px 22px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cute,.card h2,.clock-time,.tile,.tab,.pill,.classname,.btn,.thermo-val,.wx-temp,.tt-chip .s,.big-num,.cal-head,.modal h3,.modal h4{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;cursor:pointer;border:none;color:inherit;background:none;padding:0}
button:active{transform:scale(.95)}

/* ---------- 레이아웃 ---------- */
.app{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;display:grid;gap:var(--gap);padding:var(--gap);
  grid-template-columns:repeat(12,minmax(0,1fr));
  grid-template-rows:auto minmax(0,1.12fr) minmax(0,1.78fr) minmax(0,1.45fr)}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.a-clock{grid-column:1/4;grid-row:2;--tint:var(--pink)}
.a-tt{grid-column:4/10;grid-row:2;--tint:var(--sky)}
.a-weather{grid-column:10/13;grid-row:2;--tint:var(--mint)}
.a-cal{grid-column:1/4;grid-row:3;--tint:var(--lemon)}
.a-mid{grid-column:4/9;grid-row:3;display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--gap);min-height:0}
.a-sites{--tint:var(--lav)} .a-todo{--tint:var(--peach)}
.a-thermo{grid-column:9/11;grid-row:3;--tint:var(--pink)}
.a-meal{grid-column:11/13;grid-row:3;--tint:var(--lime)}
.a-stu{grid-column:1/-1;grid-row:4;--tint:var(--lav)}

.card{background:var(--card);border-radius:var(--r);border:3px solid var(--tint,var(--line));box-shadow:0 6px 0 var(--tint,var(--line));
  padding:12px 18px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;position:relative}
.card h2{margin:0 0 6px;font-size:21px;display:flex;align-items:center;gap:6px}
.card h2 .tag{background:var(--tint);padding:3px 14px 2px;border-radius:999px;color:var(--ink)}
.card h2 .right{margin-left:auto;font-family:'Gowun Dodum',sans-serif}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:18px;margin:auto;text-align:center;line-height:1.6}

/* 상단 바 */
.classname{font-size:34px;background:var(--card);padding:8px 30px;white-space:nowrap;border-radius:999px;
  border:3px solid var(--pink);box-shadow:0 5px 0 var(--pink);display:flex;align-items:center;gap:12px}
.logo{margin:-4px 0 -4px -20px;width:56px;height:56px;border-radius:50%;object-fit:contain;background:#fff;display:grid;place-items:center;font-size:28px}
.spacer{flex:1}
.sync{font-size:17px;white-space:nowrap;color:var(--muted);display:flex;align-items:center;gap:6px;margin-right:6px;background:#fffc;padding:6px 12px;border-radius:999px}
.dot{width:10px;height:10px;border-radius:50%;background:#cbbfd2}
.dot.ok{background:var(--green)} .dot.wait{background:var(--yellow)} .dot.error{background:var(--red)}
.pill{background:var(--card);padding:0 22px;height:50px;border-radius:999px;font-size:18px;border:3px solid var(--line);box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 0 #2d2333}

/* 시계 */
.a-clock{cursor:pointer;justify-content:center;align-items:center;text-align:center;background:linear-gradient(180deg,#fff 60%,#fff0f4)}
.clock-date{font-size:28px;font-weight:700}
.clock-time{font-size:104px;line-height:1.05;font-variant-numeric:tabular-nums;color:#ff7a9c;text-shadow:0 4px 0 #ffe0e8}
.clock-time .ampm{font-size:.32em;color:var(--muted);margin-right:6px;vertical-align:.9em}
.clock-time small{font-size:.36em;color:var(--muted);margin-left:4px}
.clock-hint{font-size:17px;white-space:nowrap;color:var(--muted);margin-top:2px}
.mini-timer{margin-top:4px;color:var(--red);font-family:'Jua';font-size:26px;font-variant-numeric:tabular-nums}

.clock-wrap{display:flex;align-items:center;gap:14px;height:100%;width:100%;justify-content:center}
.analog{height:min(100%,180px);aspect-ratio:1;flex:none}
.a-clock .clock-time{font-size:68px;white-space:nowrap}
.a-clock .clock-date{font-size:24px;white-space:nowrap}
.a-clock .clock-date .ampm{color:#ff7a9c;margin-left:4px}
/* 신호등 */
.signal{display:flex;align-items:center;gap:10px;margin-top:auto}
.lights{display:flex;gap:6px;background:#4a3b52;padding:6px 8px;border-radius:999px}
.lights i{width:28px;height:28px;border-radius:50%;background:#6d5d75;display:block}
.lights i.g.on{background:#45c98a;box-shadow:0 0 12px #45c98a}
.lights i.y.on{background:#ffb938;box-shadow:0 0 12px #ffb938}
.lights i.r.on{background:#ff5a7a;box-shadow:0 0 12px #ff5a7a}
.lights i.blink{animation:blink .8s infinite}
.sig-text{font-family:'Jua';font-size:23px;line-height:1.2}
.sig-text small{display:block;font-family:'Gowun Dodum';font-size:.68em;color:var(--muted);font-weight:700}
.site img{width:22px;height:22px;border-radius:6px}
.cal-grid .d.neis::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--blue);position:absolute;top:3px}
/* 시간표 */
.tt-status{font-size:29px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.tt-status b{color:var(--blue);font-family:'Jua';font-weight:400}
.tt-row{display:grid;gap:8px;flex:1;min-height:0}
.tt-chip{background:#f3f8ff;border:2px dashed var(--sky);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;min-width:0}
.tt-chip .n{font-size:17px;color:var(--muted);font-weight:700}
.tt-chip .s{font-size:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tt-chip .t{font-size:16px;white-space:nowrap;color:var(--muted)}
.tt-chip.past{opacity:.38}
.tt-chip.now{background:var(--blue);border:2px solid var(--blue);color:#fff;box-shadow:0 5px 0 #4f7ee0;transform:translateY(-3px);animation:wiggle 2.4s ease-in-out infinite}
.tt-chip.now .n,.tt-chip.now .t{color:#e8efff}
@keyframes wiggle{0%,100%{transform:translateY(-3px) rotate(0)}50%{transform:translateY(-6px) rotate(-1deg)}}

/* 날씨 */
.wx{display:flex;align-items:center;gap:12px;flex:none;min-height:0}
.wx-icon{font-size:54px;line-height:1;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.wx-temp{font-size:46px;line-height:1}
.wx-desc{font-size:18px;color:var(--muted)}
.air{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{padding:4px 12px;border-radius:999px;font-size:16px;font-weight:700}
.g1{background:#dcecff;color:#3e78d6}.g2{background:var(--green-soft);color:#249163}.g3{background:var(--yellow-soft);color:#c47a00}.g4{background:var(--red-soft);color:#d43b5f}
.play{margin-top:6px;font-family:'Jua';font-size:21px}

/* 달력 */
.cal-head{display:flex;align-items:center;justify-content:space-between;font-size:24px;margin-bottom:4px}
.cal-head button{width:38px;height:38px;border-radius:50%;background:var(--lemon);font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:2px;flex:1;min-height:0;text-align:center}
.cal-grid .w{font-size:17px;color:var(--muted);font-weight:700;align-self:center}
.cal-grid .d{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;font-weight:700;position:relative;min-height:0;aspect-ratio:1;max-height:100%;margin:auto;width:100%;max-width:44px}
.cal-grid .d.other{opacity:.25}
.cal-grid .d.sun{color:var(--red)} .cal-grid .d.sat{color:var(--blue)}
.cal-grid .d.today{background:var(--yellow);color:#fff;box-shadow:0 3px 0 #e59a12}
.cal-grid .d.ev::after{content:'♥';font-size:9px;color:var(--orange);position:absolute;bottom:-3px}
.dday{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.dday div{display:flex;gap:8px;font-size:16px;white-space:nowrap;overflow:hidden;font-weight:700}
.dday b{color:#fff;background:var(--orange);border-radius:999px;padding:0 8px;font-family:'Jua';font-weight:400;min-width:56px;text-align:center}

/* 사이트 */
.sites{display:flex;gap:8px;flex-wrap:wrap}
.site{background:#f5f1ff;border-radius:18px;padding:8px 14px;display:flex;align-items:center;gap:6px;font-weight:700;
  font-size:17px;text-decoration:none;color:inherit;min-height:44px;border:2px solid var(--lav)}
.site span{font-size:1.3em}

/* 할 일 */
.todo-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;min-height:0}
.todo{display:flex;align-items:center;gap:10px;padding:6px;border-radius:14px;font-size:25px;font-weight:700}
.todo .chk{width:30px;height:30px;flex:none;border-radius:50%;border:3px solid var(--peach);display:grid;place-items:center;font-size:16px;color:#fff}
.todo.done .chk{background:var(--green);border-color:var(--green)}
.todo.done .txt{text-decoration:line-through;color:var(--muted)}
.todo .txt{flex:1;min-width:0}
.todo .del{color:var(--muted);font-size:18px;width:36px;height:36px}
.todo-add{display:flex;gap:6px;margin-top:6px}
.todo-add input{flex:1;border:2px solid var(--peach);border-radius:14px;padding:8px 12px;min-width:0;background:#fffaf6}
.btn{background:var(--blue);color:#fff;border-radius:14px;padding:0 18px;min-height:44px;font-size:17px;box-shadow:0 4px 0 #4f7ee0}
.btn.gray{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.red{background:var(--red);box-shadow:0 4px 0 #e04a6c}

/* 온도계 */
.a-thermo{align-items:center}
.thermo{flex:1;display:flex;align-items:flex-end;gap:10px;min-height:0;width:100%;justify-content:center}
.tube{position:relative;width:44px;height:100%;display:flex;flex-direction:column;align-items:center}
.tube .glass{flex:1;width:26px;background:#fff5f8;border-radius:14px 14px 0 0;position:relative;overflow:hidden;border:3px solid var(--pink);border-bottom:none}
.tube .fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#ff6b8b,#ffb3c4);transition:height .8s cubic-bezier(.3,1.6,.5,1)}
.tube .bulb{width:48px;height:48px;border-radius:50%;background:#ff6b8b;border:3px solid var(--pink);margin-top:-4px;display:grid;place-items:center;font-size:22px}
.thermo-info{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.thermo-val{font-size:58px;color:var(--red);line-height:1}
.thermo-goal{font-size:18px;color:var(--muted);margin-top:4px;word-break:keep-all;font-weight:700}
.thermo-btns{display:flex;gap:6px;margin-top:8px;width:100%}
.thermo-btns button{flex:1;min-height:46px;border-radius:14px;background:var(--red-soft);color:var(--red);font-family:'Jua';font-size:19px;box-shadow:0 4px 0 var(--pink)}

/* 급식 */
.meal{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.meal div{font-size:23px;font-weight:700;line-height:1.4}
.meal div::before{content:'🍀 ';font-size:.7em}
.meal sup{font-size:.55em;color:var(--orange);margin-left:2px}
.meal-cal{font-size:16px;color:var(--muted);margin-top:4px}

/* 학생 조작 공간 */
.stu-tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tab{height:48px;padding:0 20px;border-radius:999px;background:var(--red-soft);color:var(--red);font-size:22px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 0 var(--pink)}
.tab .cnt{font-size:.8em;opacity:.85;font-family:'Gowun Dodum';font-weight:700}
.tab.on{background:var(--red);color:#fff;box-shadow:0 4px 0 #e04a6c}
.stu-hint{margin-left:auto;font-size:17px;white-space:nowrap;color:var(--muted)}
.tiles{flex:1;display:grid;gap:10px;min-height:0;grid-auto-rows:1fr}
.tile{border-radius:22px;background:#fff;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font-size:38px;
  display:grid;place-items:center;position:relative;transition:background .15s,transform .1s;min-height:0;color:#8e7c99}
.tile.press{transform:scale(.92)}
.tile.named{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15;padding:4px}
.tile.named .no{font-size:.5em;opacity:.7}
.tile.named .nm{font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.done{background:#fff0d6;border-color:var(--yellow);box-shadow:0 5px 0 #f3b23e;color:#c27a00;animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.tile .ic{position:absolute;top:-6px;right:-4px;font-size:.75em;filter:drop-shadow(0 2px 0 #fff)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.all-done{font-family:'Jua';font-size:22px;color:var(--green)}
.confetti{position:fixed;top:-40px;font-size:30px;z-index:90;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* 잠금 */
body.locked .t-only{display:none !important}
body.locked .site{pointer-events:none;opacity:.55}
body.personal.locked .me-change{display:none}
/* 학생용 화면 모드: 이름 체크 공간만 크게 */
.today-ev{font-family:'Jua';font-size:24px;background:#fff;border:3px solid var(--lav);box-shadow:0 4px 0 var(--lav);border-radius:999px;padding:6px 22px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:52%;cursor:pointer}
.today-ev:empty{display:none}
.today-ev .lbl{color:var(--purple)} .today-ev .dim{color:var(--muted);font-family:'Gowun Dodum';font-weight:700;font-size:20px}
body.student .today-ev{max-width:40%}
.cal-grid .d.cur:not(.today){background:#efe9ff}
.cur-table{width:100%;border-collapse:collapse;font-size:15px}
.cur-table td{padding:3px 4px;border-bottom:1px solid var(--line)}
.cur-table input[type=text],.cur-table input[type=date]{min-height:34px;padding:4px 6px;width:100%}
.top-clock{display:none;font-family:'Jua';font-size:38px;color:#ff7a9c;background:#fff;padding:4px 20px;border-radius:999px;border:3px solid var(--pink)}
body.student .top-clock{display:block}
body.student .app{grid-template-rows:auto minmax(0,1fr)}
body.student .app > .card:not(.a-stu), body.student .a-mid{display:none !important}
body.student .a-stu{grid-row:2}
body.student .tile{font-size:50px}
#qrBox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:8px}
#qrBox canvas,#qrBox img{border:8px solid #fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}

/* 개인 화면 모드 */
.a-me{display:none;--tint:var(--pink)}
body.personal .app{grid-template-rows:auto minmax(0,1fr)}
body.personal .app > .card:not(.a-me), body.personal .a-mid{display:none !important}
body.personal .a-me{display:flex;grid-column:1/-1;grid-row:2;padding:28px 36px}
body.personal .top-clock{display:block}
.me-hello{font-family:'Jua';font-size:64px;line-height:1.1;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.me-hello small{font-size:28px;color:var(--muted)}
.me-sub{font-size:24px;color:var(--muted);margin:6px 0 20px;font-weight:700}
.me-sub b{color:var(--blue)}
.me-tasks{flex:1;display:grid;gap:20px;min-height:0;grid-auto-rows:1fr}
.me-task{border-radius:36px;background:#fff;border:5px solid var(--line);box-shadow:0 10px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.me-task .i{font-size:96px;line-height:1}
.me-task .n{font-family:'Jua';font-size:52px}
.me-task .st{font-size:22px;color:var(--muted);font-weight:700}
.me-task.done{background:#fff0d6;border-color:var(--yellow);box-shadow:0 10px 0 #f3b23e;animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.me-task.done .st{color:#c27a00}
.me-pick{flex:1;display:grid;gap:14px;grid-auto-rows:1fr;min-height:0}
.me-pick button{border-radius:24px;background:#fff;border:4px solid var(--lav);box-shadow:0 6px 0 var(--lav);font-family:'Jua';font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.me-pick button small{font-size:18px;color:var(--muted)}
/* 교사 현황판 */
.board .modal{width:min(1100px,100%)}
.bd-task{border:3px solid var(--line);border-radius:22px;padding:14px 18px;margin-top:12px}
.bd-head{display:flex;align-items:center;gap:12px;font-family:'Jua';font-size:24px}
.bd-head .cnt{margin-left:auto;font-size:20px;color:var(--muted)}
.bd-bar{height:14px;border-radius:999px;background:var(--soft);overflow:hidden;margin:8px 0 10px}
.bd-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb938,#45c98a);border-radius:999px;transition:width .5s}
.bd-chips{display:flex;flex-wrap:wrap;gap:8px}
.bd-chips button{background:var(--red-soft);color:var(--red);border-radius:999px;padding:8px 14px;font-weight:700;font-size:17px;min-height:42px}
.bd-chips .ok{font-family:'Jua';color:var(--green);font-size:20px}
/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(74,59,82,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:30px;padding:24px 26px;width:min(740px,100%);max-height:92vh;overflow:auto;border:4px solid var(--pink);box-shadow:0 8px 0 var(--pink)}
.modal h3{margin:0 0 14px;font-size:26px}
.modal .row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.modal label{font-weight:700;font-size:14px;color:var(--muted);min-width:90px}
.modal input,.modal textarea,.modal select{border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-height:42px;background:#fff}
.modal textarea{width:100%;min-height:110px;font-family:monospace;font-size:13px}
.modal section{border-top:2px dashed var(--line);padding-top:14px;margin-top:16px}
.modal section h4{margin:0 0 8px;font-size:20px}
.modal .help{font-size:13px;color:var(--muted);line-height:1.6}
.modal pre{background:var(--soft);padding:10px;border-radius:10px;font-size:12px;overflow:auto;user-select:text;-webkit-user-select:text}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;position:sticky;bottom:-24px;background:#fff;padding:12px 0}
.tt-table{border-collapse:collapse;width:100%}
.tt-table th{font-size:13px;color:var(--muted);padding:4px}
.tt-table td{padding:2px}
.tt-table input{width:100%;min-width:0;padding:6px;min-height:36px;text-align:center}
.results{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.results button{text-align:left;background:var(--soft);border-radius:10px;padding:8px 12px;font-size:14px}
.logo-prev{width:64px;height:64px;border-radius:50%;object-fit:contain;border:2px solid var(--line);background:#fff}

/* PIN */
.pin-dots{display:flex;justify-content:center;gap:12px;margin:10px 0 18px}
.pin-dots i{width:20px;height:20px;border-radius:50%;background:var(--line)}
.pin-dots i.on{background:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:auto}
.pad button{height:68px;border-radius:22px;background:var(--soft);font-size:28px;font-family:'Jua';box-shadow:0 4px 0 var(--line)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* 도구 (타이머 / 뽑기) */
.tools .modal{width:min(900px,100%)}
.tool-tabs{display:flex;gap:8px;margin-bottom:10px}
.big-num{font-size:clamp(80px,14vw,220px);text-align:center;line-height:1.1;font-variant-numeric:tabular-nums;color:#ff7a9c;text-shadow:0 8px 0 #ffe0e8}
.big-num.alarm{color:var(--red);animation:blink .5s infinite}
@keyframes blink{50%{opacity:.2}}
.tool-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.tool-btns button{min-height:56px;min-width:80px;font-size:20px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;
  font-weight:700;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}

/* 세로 화면/작은 화면 */
@media (max-width:900px),(orientation:portrait){
  html,body{overflow:auto}
  .app{position:static;width:auto;height:auto;transform:none!important;display:flex;flex-direction:column}
  .a-clock .clock-time{font-size:56px} .clock-time{font-size:56px} .analog{height:140px}
  .card{min-height:180px}
  .a-mid{display:flex;flex-direction:column}
  .tiles{grid-template-columns:repeat(6,1fr)!important}
  .tile{min-height:56px}
  .thermo{min-height:200px}
}
</style>

<body>
<div class="app">

</div></div>

<div class="toast" id="toast"></div>

<script>
/* ================= 기본 도구 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const pad = n => String(n).padStart(2, '0');
const ymd = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const arr = x => Array.isArray(x) ? x : (x && typeof x === 'object' ? Object.values(x) : []);
const DOW = ['일','월','화','수','목','금','토'];
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
function getIn(o, p){ return p.split('/').filter(Boolean).reduce((a, k) => a == null ? undefined : a[k], o); }
function setIn(o, p, v){
  const ks = p.split('/').filter(Boolean); let c = o;
  for(let i = 0; i < ks.length - 1; i++){ if(typeof c[ks[i]] !== 'object' || c[ks[i]] === null) c[ks[i]] = {}; c = c[ks[i]]; }
  const last = ks[ks.length-1];
  if(v === null || v === undefined) delete c[last]; else c[last] = v;
}

/* ================= 기본 설정 ================= */
const DEFAULTS = {
  className: '명덕초 0학년 0반',
  logo: '',                   // dataURL (설정에서 업로드) – 없으면 logo.png 파일 사용
  students: [],               // 학생 이름 목록
  studentCount: 25,
  pin: '1234',
  periods: [['09:00','09:40'],['09:50','10:30'],['10:40','11:20'],['11:30','12:10'],['13:00','13:40'],['13:50','14:30'],['','']],
  timetable: {1:[],2:[],3:[],4:[],5:[]},
  school: null,                // {name, office, code}
  neisKey: '',
  place: {name:'서울', lat:37.5665, lon:126.978},
  sites: [
    {icon:'', name:'e학습터', url:'https://cls.edunet.net/'},
    {icon:'', name:'에듀넷', url:'https://www.edunet.net/'},
    {icon:'', name:'유튜브', url:'https://www.youtube.com/'},
    {icon:'', name:'패들렛', url:'https://padlet.com/'},
    {icon:'', name:'구글', url:'https://www.google.com/'}
  ],
  tasks: [{id:'milk', name:'우유', icon:'🥛'}, {id:'brush', name:'양치', icon:'🪥'}, {id:'done', name:'다했어요', icon:'⭐'}],
  thermoGoal: 100,
  thermoReward: ''
};
const S = () => ({...DEFAULTS, ...(Store.get('settings') || {})});
// 학생 명단: 이름이 있으면 이름, 없으면 학생 수만큼 번호
function roster(s = S()){
  const names = arr(s.students).map(x => String(x || '').trim()).filter(Boolean);
  if(names.length) return names.map((name, i) => ({n: i + 1, name}));
  const N = Math.max(1, Math.min(40, Number(s.studentCount) || 25));
  return Array.from({length: N}, (_, i) => ({n: i + 1, name: ''}));
}

/* ================= 저장소 (로컬 ↔ Firebase) ================= */
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('class-dash') : null;
const Store = {
  data: LS.get('dash:data', {}), mode: 'local', ref: null, listeners: [],
  on(fn){ this.listeners.push(fn); },
  emit(){ LS.set('dash:data', this.data); this.listeners.forEach(f => f(this.data)); },
  get(p){ return getIn(this.data, p); },
  set(p, v){
    v = v == null ? null : JSON.parse(JSON.stringify(v));
    if(this.mode === 'fb') this.ref.child(p).set(v).catch(e => setSync('error', '저장 실패: ' + (e.code || e.message)));
    else { setIn(this.data, p, v); this.emit(); bc && bc.postMessage('changed'); }
  },
  incr(p, n){
    if(this.mode === 'fb') this.ref.child(p).set(firebase.database.ServerValue.increment(n));
    else this.set(p, (Number(this.get(p)) || 0) + n);
  },
  replaceAll(obj){
    obj = JSON.parse(JSON.stringify(obj || {}));
    if(this.mode === 'fb') this.ref.set(obj);
    else { this.data = obj; this.emit(); bc && bc.postMessage('changed'); }
  }
};
if(bc) bc.onmessage = () => { if(Store.mode === 'local'){ Store.data = LS.get('dash:data', {}); Store.listeners.forEach(f => f(Store.data)); } };

// 명덕초 대시보드 기본 Firebase 프로젝트 (웹 설정값은 공개용 값이며, 보안은 DB 규칙 + 익명 로그인으로 지킴)
const BUILTIN_FB = {
  apiKey: "AIzaSyDSkVMCuh3PCEzsEF3RfzbL3EeAWaQOM20",
  authDomain: "dashmduck.firebaseapp.com",
  databaseURL: "https://dashmduck-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dashmduck",
  storageBucket: "dashmduck.firebasestorage.app",
  messagingSenderId: "887856328043",
  appId: "1:887856328043:web:fca964ae719d660637b02e"
};
function setSync(state, text){
  $('#syncDot').className = 'dot ' + state;
  $('#syncText').textContent = text;
}
function loadScript(src){
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('스크립트 로드 실패')); document.head.appendChild(s); });
}
async function startSync(){
  const cfg = LS.get('dash:sync', null);
  if(!cfg || !cfg.code){ setSync('', '이 기기에만 저장'); return; }
  setSync('wait', '연결 중…');
  try{
    const V = '10.12.2';
    await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-database-compat.js`);
    firebase.initializeApp(cfg.config || BUILTIN_FB);
    try{ await firebase.auth().signInAnonymously(); }catch(e){ console.warn('익명 로그인 실패(규칙이 공개면 무시 가능):', e.code); }
    const ref = firebase.database().ref('classes/' + cfg.code);
    const first = await ref.once('value');
    if(!first.exists() && Object.keys(Store.data).length) await ref.set(Store.data);   // 첫 기기: 로컬 데이터 올리기
    Store.ref = ref; Store.mode = 'fb';
    ref.on('value', snap => { Store.data = snap.val() || {}; Store.emit(); },
      e => setSync('error', '권한 오류 – 보안 규칙 확인'));
    firebase.database().ref('.info/connected').on('value', s =>
      s.val() ? setSync('ok', `동기화 중 · ${cfg.code}`) : setSync('wait', '연결 끊김 · 재연결 중'));
  }catch(e){
    console.error(e);
    setSync('error', '동기화 실패 · 이 기기에만 저장');
  }
}

/* ================= 잠금 ================= */
// 연결 링크(#join=...)로 열면 동기화 설정을 자동 저장
(() => {
  const m = location.hash.match(/#join=([^&]+)/);
  if(m){
    try{
      const j = JSON.parse(atob(decodeURIComponent(m[1])));
      if(j.code){
        LS.set('dash:sync', {code: j.code, config: j.config || null});
        if(j.mode){ LS.set('dash:mode', j.mode); if(j.mode !== 'full') LS.set('dash:locked', true); }
      }
    }catch(e){ console.warn('연결 링크 오류', e); }
    history.replaceState(null, '', location.pathname + location.search);
  }
  const qm = new URLSearchParams(location.search).get('mode');
  if(qm === 'student' || qm === 'full'){ LS.set('dash:mode', qm); if(qm === 'student' && !LS.get('dash:modeLocked', false)){ LS.set('dash:locked', true); LS.set('dash:modeLocked', true); } }
})();
let viewMode = LS.get('dash:mode', 'full');
function applyMode(){
  document.body.classList.toggle('student', viewMode === 'student');
  document.body.classList.toggle('personal', viewMode === 'personal');
}
applyMode();
let locked = LS.get('dash:locked', false);
function applyLock(){
  document.body.classList.toggle('locked', locked);
  $('#btnLock').innerHTML = locked ? '🔒 잠김' : '🔓 잠금';
  $('#btnLock').classList.toggle('on', locked);
}
$('#btnLock').onclick = () => {
  if(!locked){ locked = true; LS.set('dash:locked', true); applyLock(); toast('잠금: 학생 조작 공간만 사용할 수 있어요'); }
  else openPin();
};
function openPin(){
  let v = '';
  const draw = () => {
    openModal(`<h3 style="text-align:center">🔒 잠금 해제</h3>
      <div class="pin-dots" id="pinDots">${[0,1,2,3,4,5].slice(0, Math.max(4, v.length)).map(i => `<i class="${i < v.length ? 'on' : ''}"></i>`).join('')}</div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
      <button data-k="x">취소</button><button data-k="0">0</button><button data-k="b">⌫</button></div>
      <div class="tool-btns"><button class="btn" data-k="ok" style="min-width:200px">확인</button></div>`);
    $('#ovBody').onclick = e => {
      const k = e.target.closest('[data-k]')?.dataset.k; if(!k) return;
      if(k === 'x') return closeModal();
      if(k === 'b'){ v = v.slice(0, -1); return draw(); }
      if(k === 'ok' || v.length >= 6){
        if(v === String(S().pin)){ locked = false; LS.set('dash:locked', false); applyLock(); closeModal(); toast('잠금 해제'); }
        else { v = ''; draw(); $('#pinDots').classList.add('shake'); }
        return;
      }
      v += k;
      if(v === String(S().pin)){ locked = false; LS.set('dash:locked', false); applyLock(); closeModal(); toast('잠금 해제'); return; }
      draw();
    };
  };
  draw();
}

/* ================= 모달 ================= */
function openModal(html, view = ''){ $('#ovBody').innerHTML = html; $('#ovBody').dataset.view = view; $('#ov').classList.toggle('board', view === 'board'); $('#ov').classList.add('show'); }
function closeModal(){ $('#ov').classList.remove('show', 'board'); $('#ovBody').onclick = null; $('#ovBody').dataset.view = ''; }
$('#ov').addEventListener('pointerdown', e => { if(e.target.id === 'ov') closeModal(); });
function ask(title, value = '', placeholder = ''){
  return new Promise(res => {
    openModal(`<h3>${esc(title)}</h3><form id="askF"><input id="askI" style="width:100%" value="${esc(value)}" placeholder="${esc(placeholder)}" maxlength="40">
      <div class="modal-foot"><button type="button" class="btn gray" id="askC">취소</button><button class="btn">확인</button></div></form>`);
    const i = $('#askI'); setTimeout(() => i.focus(), 50);
    $('#askC').onclick = () => { closeModal(); res(null); };
    $('#askF').onsubmit = e => { e.preventDefault(); closeModal(); res(i.value.trim() || null); };
  });
}
function confirmBox(msg){
  return new Promise(res => {
    openModal(`<h3>${esc(msg)}</h3><div class="modal-foot"><button class="btn gray" id="cN">취소</button><button class="btn red" id="cY">확인</button></div>`);
    $('#cN').onclick = () => { closeModal(); res(false); };
    $('#cY').onclick = () => { closeModal(); res(true); };
  });
}

/* ================= 시계 ================= */
let lastMinute = -1, lastDay = ymd();
function tick(){
  const d = new Date();
  const h = d.getHours(), ap = h < 12 ? '오전' : '오후', h12 = h % 12 || 12;
  $('#clockDate').innerHTML = `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})<span class="ampm">${ap}</span>`;
  $('#clockTime').innerHTML = `${h12}:${pad(d.getMinutes())}<small>${pad(d.getSeconds())}</small>`;
  drawAnalog(d);
  $('#topClock').textContent = `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]}) ${h12}:${pad(d.getMinutes())}`;
  if(d.getMinutes() !== lastMinute){ lastMinute = d.getMinutes(); renderTimetable(); renderMe(); if(d.getHours() === 14 && d.getMinutes() === 0) loadMeal(true); }
  if(ymd(d) !== lastDay){ lastDay = ymd(d); calOffset = 0; pruneChecks(); renderAll(); loadMeal(true); }
  timerTick();
}

function drawAnalog(d){
  const svg = $('#analog');
  if(!svg.dataset.ready){
    let h = '<circle cx="50" cy="50" r="47" fill="#fff" stroke="#ffc7d6" stroke-width="4"/>';
    for(let i = 1; i <= 12; i++){
      const a = i * Math.PI / 6, x = 50 + 37 * Math.sin(a), y = 50 - 37 * Math.cos(a) + 3.6;
      h += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="10" font-family="Jua" fill="${i % 3 ? '#b9a9c2' : '#ff7a9c'}">${i}</text>`;
    }
    h += '<line id="hH" x1="50" y1="50" x2="50" y2="27" stroke="#4a3b52" stroke-width="5" stroke-linecap="round"/>'
       + '<line id="hM" x1="50" y1="50" x2="50" y2="17" stroke="#6c9cff" stroke-width="3.5" stroke-linecap="round"/>'
       + '<line id="hS" x1="50" y1="56" x2="50" y2="14" stroke="#ff6b8b" stroke-width="1.5" stroke-linecap="round"/>'
       + '<circle cx="50" cy="50" r="4" fill="#ff6b8b"/>';
    svg.innerHTML = h; svg.dataset.ready = 1;
  }
  const s = d.getSeconds(), m = d.getMinutes() + s / 60, h = d.getHours() % 12 + m / 60;
  $('#hH').setAttribute('transform', `rotate(${h * 30} 50 50)`);
  $('#hM').setAttribute('transform', `rotate(${m * 6} 50 50)`);

}

/* ================= 시간표 ================= */
const toMin = t => { if(!t) return null; const [h, m] = String(t).split(':').map(Number); return isNaN(h) ? null : h*60 + (m||0); };
function renderTimetable(){
  const s = S(), now = new Date(), today = now.getDay();
  const row = $('#ttRow'), st = $('#ttStatus');
  const build = dow => {
    const subj = arr((s.timetable || {})[dow]);
    let ps = arr(s.periods).map((p, i) => ({n:i+1, a:toMin(p?.[0]), b:toMin(p?.[1]), s:p?.[0], e:p?.[1], sub:subj[i] || ''}))
      .filter(p => p.a != null && p.b != null);
    if(ps.some(p => p.sub)) ps = ps.filter(p => p.sub);
    return ps;
  };
  let periods = today >= 1 && today <= 5 ? build(today) : [];
  let mins = now.getHours()*60 + now.getMinutes();
  const lastEnd = periods.length ? periods[periods.length - 1].b : -1;
  if(!periods.length || mins >= lastEnd){
    // 주말이거나 오늘 수업이 끝났으면 → 다음 등교일 시간표
    const nd = today >= 5 || today === 0 ? 1 : today + 1;          // 금·토·일 → 월요일
    const label = (today >= 1 && today <= 4) ? '내일' : '월요일';
    periods = build(nd);
    $('#ttTitle').textContent = `📚 ${label}(${DOW[nd]}) 시간표`;
    st.innerHTML = lastEnd > 0 ? `오늘 수업 끝! 수고했어요 👏 <b>${label} 시간표</b>를 미리 봐요`
      : (today === 0 || today === 6) ? `즐거운 주말 🎈 <b>월요일 시간표</b>예요` : '설정에서 오늘 시간표를 입력하세요';
    row.style.gridTemplateColumns = `repeat(${Math.max(1, periods.length)}, minmax(0,1fr))`;
    row.innerHTML = periods.map(p => `<div class="tt-chip"><span class="n">${p.n}교시</span><span class="s">${esc(p.sub) || '–'}</span><span class="t">${p.s}~${p.e}</span></div>`).join('')
      || '<div class="empty">설정에서 시간표를 입력하세요</div>';
    return;
  }
  $('#ttTitle').textContent = '📚 오늘의 시간표';
  const cur = periods.find(p => mins >= p.a && mins < p.b);
  const next = periods.find(p => p.a > mins);
  const name = p => `${p.n}교시${p.sub ? ' ' + esc(p.sub) : ''}`;
  if(cur) st.innerHTML = `지금 <b>${name(cur)}</b> · ${cur.b - mins}분 남음`;
  else if(mins < periods[0].a) st.innerHTML = `수업 전 · <b>${name(periods[0])}</b> ${periods[0].a - mins}분 후 시작`;
  else if(next){
    const prev = periods.filter(p => p.b <= mins).pop();
    const label = prev && next.a - prev.b >= 30 ? '점심시간 🍚' : '쉬는 시간';
    st.innerHTML = `${label} · 다음 <b>${name(next)}</b> ${next.a - mins}분 후`;
  }
  row.style.gridTemplateColumns = `repeat(${periods.length}, minmax(0,1fr))`;
  row.innerHTML = periods.map(p => `<div class="tt-chip ${p === cur ? 'now' : (mins >= p.b ? 'past' : '')}">
      <span class="n">${p.n}교시</span><span class="s">${esc(p.sub) || '–'}</span><span class="t">${p.s}~${p.e}</span></div>`).join('');
}

/* ================= 날씨 · 미세먼지 ================= */
const WX = c => c === 0 ? ['☀️','맑음'] : c <= 2 ? ['🌤️','구름 조금'] : c === 3 ? ['☁️','흐림'] : c <= 48 ? ['🌫️','안개']
  : c <= 57 ? ['🌦️','이슬비'] : c <= 67 ? ['🌧️','비'] : c <= 77 ? ['🌨️','눈'] : c <= 82 ? ['🌦️','소나기'] : c <= 86 ? ['🌨️','눈'] : ['⛈️','뇌우'];
const pmGrade = (v, t) => v == null ? null : v <= t[0] ? 1 : v <= t[1] ? 2 : v <= t[2] ? 3 : 4;
const GN = ['', '좋음', '보통', '나쁨', '매우나쁨'];
let wxKey = '';
async function loadWeather(force){
  const p = S().place; const key = `${p.lat},${p.lon}`;

      {l:'r', face:'😷', t:'공기가 나빠요', sub:'마스크 · 실내 활동'},
      {l:'r', face:'🤢', t:'공기가 아주 나빠요', sub:'바깥 활동 금지', blink:true}][worst];
    const play = SIG ? `<div class="signal"><div class="lights">${['g','y','r'].map(c => `<i class="${c} ${SIG.l === c ? 'on' : ''} ${SIG.l === c && SIG.blink ? 'blink' : ''}"></i>`).join('')}</div>

      ${play}`;
  }catch(e){
    wxKey = '';
    box.innerHTML = '<div class="empty">날씨를 불러오지 못했어요<br>(인터넷 연결 확인)</div>';

/* ================= 학교교육과정 행사 ================= */
/*PARSER-START*/
// PDF 텍스트 줄들에서 학사일정을 뽑는다. 결과: [{date:'YYYY-MM-DD', end:'YYYY-MM-DD', title}]
function parseCurriculum(lines){
  const text = lines.join('\n');
  // 기준 학년도: 'YYYY. 3~12. D.' 꼴 날짜에 가장 많이 나온 연도
  const cnt = {};
  for(const m of text.matchAll(/(20\d\d)\s?\.\s?(\d{1,2})\s?\.\s?\d{1,2}/g)) if(+m[2] >= 3) cnt[m[1]] = (cnt[m[1]] || 0) + 1;
  const base = Number(Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || new Date().getFullYear());
  const yOf = m => m >= 3 ? base : base + 1;                       // 3월~12월: 올해, 1~2월: 다음 해
  const p2 = n => String(n).padStart(2, '0');
  const mk = (y, m, d) => (m >= 1 && m <= 12 && d >= 1 && d <= 31) ? `${y}-${p2(m)}-${p2(d)}` : null;
  const clean = t => t.replace(/^\s*20\d\d\s*\.\s*/, '').replace(/\s*\((?:[월화수목금토일])\)\s*$/, '').replace(/\s+/g, ' ').replace(/[★◯·\s]+$/, '').trim();
  const out = [];
  const add = (date, end, title) => {
    title = clean(title || '');
    if(!date || !title || title.length < 2 || !/[가-힣]/.test(title) || /^[\d\s().~-]+$/.test(title)) return;
    if(end && end < date) end = null;
    out.push({date, end: end && end !== date ? end : null, title});
  };
  // ① '3.3. 시업식, 입학식' · '6.10.-6.11. 4학년 생존수영' · '9.7.~9. 6학년수학여행' · '12.7~11. 학급 발표회'
  const reShort = /(?<![\d.])(?<!20\d\d\s?\.\s?)(\d{1,2})\s?\.\s?(\d{1,2})\.?(?:\s*\([월화수목금토일]\))?(?:\s*[-~]\s*(?:(\d{1,2})\s?\.\s?)?(\d{1,2})\.?(?:\s*\([월화수목금토일]\))?)?\s{1,3}([가-힣0-9A-Za-z][^★◯\n]*?)(?=\s{3,}|★|◯|$)/g;
  // ② '여름방학 2026. 7. 25.(토)~2026. 8. 31.(일)' · 표 형식 '3‧1절    2026. 3. 1.(일)'
  const reFull = /(20\d\d)\s?\.\s?(\d{1,2})\s?\.\s?(\d{1,2})\.?(?:\s*\([월화수목금토일]\))?(?:\s*~\s*(?:(20\d\d)\s?\.\s?)?(\d{1,2})\s?\.\s?(\d{1,2})\.?)?/g;
  for(const raw of lines){
    const line = raw.replace(/‧|·/g, '·');
    if(/(20\d\d)\s?\.\s?\d{1,2}\s?\.\s?\d{1,2}/.test(line)){
      // 긴 날짜는 바로 앞 글자 덩어리를 제목으로
      const segs = line.split(/\s{2,}/).map(x => x.trim()).filter(Boolean);
      segs.forEach((seg, i) => {
        reFull.lastIndex = 0; let m;
        while((m = reFull.exec(seg))){
          const y = +m[1], mo = +m[2], d = +m[3];
          if(y !== yOf(mo)) continue;                                   // 연혁 등 다른 해 날짜는 제외
          const ey = m[4] ? +m[4] : (m[5] && +m[5] < mo ? y + 1 : y);
          const date = mk(y, mo, d), end = m[6] ? mk(ey, +m[5], +m[6]) : null;
          let title = seg.slice(0, m.index).trim();
          if(!title && i > 0 && !/20\d\d\s?\./.test(segs[i-1])) title = segs[i-1];
          if(title && !/학기|소계|기간|^\d/.test(title)) add(date, end, title);
        }
      });
      continue;
    }
    reShort.lastIndex = 0; let m;
    while((m = reShort.exec(line))){
      const mo = +m[1], d = +m[2];
      if(mo < 1 || mo > 12) continue;
      const date = mk(yOf(mo), mo, d);
      let end = null;
      if(m[4]){ const em = m[3] ? +m[3] : mo; end = mk(yOf(em), em, +m[4]); }
      add(date, end, m[5]);
    }
  }
  // 같은 날 비슷한 이름은 하나로
  const norm = t => t.replace(/[\s()·,.~-]/g, '');
  const res = [];
  out.sort((a, b) => a.date.localeCompare(b.date) || (b.end ? 1 : 0) - (a.end ? 1 : 0)).forEach(e => {
    const hs = t => new Set(t.replace(/및/g, '').match(/[가-힣]/g) || []);
    const sim = (a, b) => { const A = hs(a), B = hs(b); let k = 0; A.forEach(c => B.has(c) && k++); return k / (new Set([...A, ...B]).size || 1); };
    const dup = res.find(r => r.date === e.date && (norm(r.title).includes(norm(e.title)) || norm(e.title).includes(norm(r.title)) || sim(r.title, e.title) >= .6));
    if(dup){ if(!dup.end && e.end) dup.end = e.end; if(e.title.length > dup.title.length) dup.title = e.title; }
    else res.push({...e});
  });
  return res;
}
/*PARSER-END*/
// PDF → 줄 텍스트 (pdf.js, 같은 높이의 글자를 한 줄로 모으고 간격이 크면 칸 구분용 공백)
async function pdfLines(file){
  if(!window.pdfjsLib){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const doc = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const lines = [];
  for(let i = 1; i <= doc.numPages; i++){
    const tc = await (await doc.getPage(i)).getTextContent();
    lines.push(...itemsToLines(tc.items));
  }
  return lines;
}
function itemsToLines(items){
  const rows = [];
  items.filter(it => it.str && it.str.trim()).forEach(it => {
    const y = it.transform[5], x = it.transform[4];
    let r = rows.find(r => Math.abs(r.y - y) < 3);
    if(!r){ r = {y, items: []}; rows.push(r); }
    r.items.push({x, w: it.width, s: it.str});
  });
  rows.sort((a, b) => b.y - a.y);
  return rows.map(r => {
    r.items.sort((a, b) => a.x - b.x);
    let line = '', endX = null;
    r.items.forEach(it => {
      if(endX !== null){ const gap = it.x - endX; line += gap > 12 ? '    ' : gap > 1.5 ? ' ' : ''; }
      line += it.s; endX = it.x + it.w;
    });
    return line;
  });
}

function confetti(icon){

    c.style.animationDuration = 2 + Math.random() * 2 + 's'; c.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 5000);
  }
}

let tLeft = 300, tEnd = 0, tRunning = false, tAlarm = false;
const fmt = s => `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
function timerTick(){
  if(tRunning){
    tLeft = Math.max(0, Math.round((tEnd - Date.now()) / 1000));
    if(tLeft === 0){ tRunning = false; tAlarm = true; beep(); $('#toolsOv').classList.add('show'); showTool('timer'); }
  }
  $('#timerNum').textContent = fmt(tLeft);
  $('#timerNum').classList.toggle('alarm', tAlarm);
  $('#timerStart').textContent = tRunning ? '일시정지' : '시작';
  $('#miniTimer').textContent = tRunning ? '⏱ ' + fmt(tLeft) : '';
}
function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .6, 1.2, 1.8].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.4, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .45);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .5);
    });
  }catch(e){}
}
document.querySelector('#toolTimer').onclick = e => {
  const b = e.target.closest('button'); if(!b) return; tAlarm = false;
  if(b.dataset.min){ tRunning = false; tLeft = b.dataset.min * 60; }
  else if(b.dataset.add){ tLeft += 60; if(tRunning) tEnd += 60000; }
  else if(b.id === 'timerStart'){ if(tRunning){ tRunning = false; } else if(tLeft > 0){ tRunning = true; tEnd = Date.now() + tLeft * 1000; } }
  else if(b.id === 'timerReset'){ tRunning = false; tLeft = 300; }
  timerTick();
};

$('#pickGo').onclick = () => {

  if(!pool.length){ $('#pickNum').textContent = '끝!'; return; }
  const final = pool[Math.floor(Math.random() * pool.length)]; let k = 0;
  const iv = setInterval(() => {
    $('#pickNum').textContent = pool[Math.floor(Math.random() * pool.length)];
    if(++k > 14){ clearInterval(iv); $('#pickNum').textContent = final; picked.push(final); pickInfo(); }
  }, 70);
};
$('#pickReset').onclick = () => { picked = []; $('#pickNum').textContent = '?'; pickInfo(); };
function showTool(name){

  $('#syncOn').onclick = () => {
    const code = $('#syncCode').value.trim().replace(/[^A-Za-z0-9_-]/g, '');
    const raw = $('#syncCfg').value, config = {};
    const jm = raw.match(/#join=([^\s&]+)/);
    if(jm){
      try{ const j = JSON.parse(atob(decodeURIComponent(jm[1]))); LS.set('dash:sync', {code: j.code, config: j.config || null}); return location.reload(); }
      catch(e){ return toast('연결 링크가 올바르지 않아요'); }
    }
    for(const m of raw.matchAll(/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g)) config[m[1]] = m[2];
    if(!code) return toast('학급 코드를 영문·숫자로 입력하세요');
    if(!raw.trim()){ LS.set('dash:sync', {code, config: null}); return location.reload(); }   // 기본 Firebase
    if(!config.apiKey || !config.projectId) return toast('firebaseConfig 를 확인하세요');
    if(!config.databaseURL) return toast('databaseURL 이 없어요 – Realtime Database 를 먼저 만든 뒤 설정을 다시 복사하세요');
    LS.set('dash:sync', {code, config}); location.reload();
  };
  $('#syncOff').onclick = () => { LS.set('dash:sync', null); location.reload(); };
  $('#viewMode').value = viewMode;
  document.querySelectorAll('[data-join]').forEach(b => b.onclick = async () => {
    const mode = b.dataset.join, base = $('#joinBase').value.trim();
    const link = base.split('#')[0] + '#join=' + encodeURIComponent(btoa(JSON.stringify(sync.config ? {code: sync.code, config: sync.config, mode} : {code: sync.code, mode})));
    const box = $('#qrBox');
    box.innerHTML = `<div id="qr"></div><div style="flex:1;min-width:220px"><b>${({student:'학생용', personal:'개인용 (처음 열면 이름 선택)', full:'교사용'})[mode]} 연결</b>
      <textarea readonly style="min-height:80px;margin-top:6px">${esc(link)}</textarea><button class="btn gray" type="button" id="copyLink">링크 복사</button></div>`;
    $('#copyLink').onclick = () => navigator.clipboard?.writeText(link).then(() => toast('복사했어요'));
    try{
      if(!window.QRCode) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js');
      new QRCode($('#qr'), {text: link, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.L});
    }catch(e){ $('#qr').textContent = 'QR을 만들지 못했어요 (링크를 복사해서 쓰세요)'; }
  });

  const curInfo = () => {
    const c = Store.get('curriculum');
    $('#curInfo').textContent = c ? `등록됨: ${c.name || '교육과정'} · 행사 ${arr(c.events).length}개` : `기본 탑재: ${DEFAULT_CURRICULUM.name} · 행사 ${DEFAULT_CURRICULUM.events.length}개`;
  };
  curInfo();
  $('#curFile').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    $('#curInfo').textContent = 'PDF를 읽는 중… (쪽수가 많으면 10초쯤 걸려요)';
    try{
      const evs = parseCurriculum(await pdfLines(f));
      if(!evs.length){ $('#curInfo').textContent = '날짜가 적힌 행사를 찾지 못했어요. 다른 파일인지 확인해 주세요.'; return; }
      editCurriculum(evs, f.name.replace(/\.pdf$/i, ''));
    }catch(err){ console.error(err); $('#curInfo').textContent = 'PDF를 읽지 못했어요 (인터넷 연결 확인)'; }
  };
  $('#curEdit').onclick = () => editCurriculum(curEvents(), Store.get('curriculum/name') || DEFAULT_CURRICULUM.name);
  $('#curReset').onclick = async () => { if(await confirmBox('기본 탑재된 교육과정 일정으로 되돌릴까요?')){ Store.set('curriculum', null); toast('되돌렸어요'); } };
  $('#expBtn').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(Store.data, null, 2)], {type:'application/json'}));
    a.download = `학급대시보드_${ymd()}.json`; a.click();
  };
  $('#impFile').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try{ const obj = JSON.parse(await f.text()); if(await confirmBox('지금 데이터를 파일 내용으로 바꿀까요?')){ Store.replaceAll(obj); toast('가져오기 완료'); } }
    catch(err){ toast('JSON 파일을 읽지 못했어요'); }
  };

  $('#sCancel').onclick = closeModal;
  $('#sSave').onclick = () => {
    const pin = $('#sPin').value.replace(/\D/g, '');
    if(pin.length < 4) return toast('PIN은 숫자 4~6자리로 입력하세요');
    const timetable = {};
    [1,2,3,4,5].forEach(d => timetable[d] = [0,1,2,3,4,5,6].map(i => $(`#tt${d}_${i}`).value.trim()));
    const tasks = [...document.querySelectorAll('.task-row')].map(r => ({id: r.dataset.id || 't' + uid(), name: r.querySelector('.tn').value.trim(), icon: r.querySelector('.ti').value.trim()})).filter(t => t.name);
    const students = $('#sStudents').value.split(/[\n\t,]+/).map(x => x.replace(/^\s*\d+[.)]?\s*/, '').trim()).filter(Boolean).slice(0, 40);
    Store.set('settings', {
      className: $('#sName').value.trim() || DEFAULTS.className,
      studentCount: Math.max(1, Math.min(40, Number($('#sCount').value) || 25)),
      pin,
      thermoGoal: Math.max(1, Number($('#sGoal').value) || 100),
      thermoReward: $('#sReward').value.trim(),
      periods: [0,1,2,3,4,5,6].map(i => [$('#ps' + i).value, $('#pe' + i).value]),
      timetable, school, place, logo, students,
      neisKey: $('#sKey').value.trim(),
      sites: [...document.querySelectorAll('.site-row')].map(r => ({icon: r.querySelector('.si').value.trim(), name: r.querySelector('.sn').value.trim(), url: r.querySelector('.su').value.trim()}))
        .filter(x => x.name && x.url).map(x => ({...x, url: /^https?:\/\//.test(x.url) ? x.url : 'https://' + x.url})),
      tasks
    });
    const vm = $('#viewMode').value;
    if(vm !== viewMode){ viewMode = vm; LS.set('dash:mode', vm); applyMode(); if(vm !== 'full'){ locked = true; LS.set('dash:locked', true); applyLock(); } renderStudents(); renderMe(); }
    closeModal(); toast('저장했어요'); loadMeal(true); loadWeather(true);
  };
}

/* ================= 전체화면 · 화면 꺼짐 방지 ================= */
$('#btnFull').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
let wakeLock = null;
async function keepAwake(){ try{ if('wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.onrelease = () => wakeLock = null; } }catch(e){} }
document.addEventListener('pointerdown', keepAwake, {once:true});
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && keepAwake());

/* ================= 시작 ================= */
let lastSchool = '', lastPlace = '';
function renderAll(){
  const s = S();
  $('#className').textContent = s.className;
  const lg = $('#logo'), src = s.logo || 'logo.png';
  if(lg.getAttribute('src') !== src){ lg.style.display = ''; lg.onerror = () => lg.style.display = 'none'; lg.src = src; }
  document.title = `${s.className} 대시보드`;
  renderTimetable(); renderCalendar(); renderSites(); renderTodos(); renderThermo(); renderStudents(); renderMe(); renderTodayEvent();
  if($('#ovBody').dataset.view === 'board' && $('#ov').classList.contains('show')) renderBoard();
  const sc = JSON.stringify(s.school || null), pl = JSON.stringify(s.place);
  if(sc !== lastSchool){ lastSchool = sc; loadMeal(); Object.keys(neisSched).forEach(k => delete neisSched[k]); renderCalendar(); }
  if(pl !== lastPlace){ lastPlace = pl; loadWeather(); }
}
// 1920×1080 기준 화면을 창 크기에 맞춰 확대·축소 (남는 쪽 방향은 칸을 늘려서 채움)
function fitStage(){
  const app = $('.app'), W = innerWidth, H = innerHeight;
  const narrow = window.matchMedia('(max-width:900px),(orientation:portrait)').matches;
  document.body.classList.toggle('scrollable', narrow);
  if(narrow){ app.style.transform = ''; app.style.width = app.style.height = ''; return; }
  let k, w, h;
  if(W / H >= 16 / 9){ k = H / 1080; h = 1080; w = W / k; } else { k = W / 1920; w = 1920; h = H / k; }
  app.style.width = w + 'px'; app.style.height = h + 'px'; app.style.transform = `scale(${k})`;
}
window.addEventListener('resize', fitStage); fitStage();
window.addEventListener('scroll', () => { if(!document.body.classList.contains('scrollable') && (scrollX || scrollY)) scrollTo(0, 0); });
Store.on(renderAll);
applyLock();
renderAll();
tick(); setInterval(tick, 1000);
setInterval(() => loadWeather(true), 30 * 60 * 1000);
setInterval(() => loadMeal(true), 2 * 60 * 60 * 1000);
window.addEventListener('resize', renderStudents);
startSync().then(pruneChecks);

/* ================= 웹앱(PWA) 설치 ================= */
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#btnInstall').style.display = ''; });
$('#btnInstall').onclick = async () => { if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#btnInstall').style.display = 'none'; };
window.addEventListener('appinstalled', () => toast('앱으로 설치했어요'));
</script>
